name: Build 3105

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: List project
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj -list 2>&1 | head -40

      - name: Build (verbose)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build > build.log 2>&1
          echo "exit=$?" >> build.log
          tail -5 build.log

      - name: Show errors
        if: always()
        run: |
          echo "======== ERROR LINES ========"
          grep -nE "error:|error :|fatal error|cannot find|No such|failed" build.log | head -40 || true
          echo "======== LAST 60 LINES ========"
          tail -60 build.log || true

      - name: Find app
        if: always()
        run: |
          find . -name "*.app" -maxdepth 6 2>/dev/null | head
          ls -la dd/Build/Products/Release-iphoneos/ 2>/dev/null || true

      - name: Package ipa
        if: steps.build.outcome == 'success'
        run: |
          APP=$(find . -name "3105.app" -maxdepth 6 | head -1)
          echo "APP=$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry 3105.ipa Payload
          brew install ldid >/dev/null 2>&1 || true
          command -v ldid >/dev/null && ldid -S 3105.ipa && mv 3105.ipa 3105-signed.ipa || true
          ls -la *.ipa

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            *.ipa
            build.log
            dd/Build/Products/Release-iphoneos/*.app
          if-no-files-found: warn
