name: Build 3105

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (verbose)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/dd" \
            HEADER_SEARCH_PATHS="$(PWD)/include" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build > build.log 2>&1
          echo "=== exit=$? ===" | tee -a build.log
          tail -3 build.log

      - name: Show errors
        if: always()
        run: |
          echo "======== ERRORS ========"
          grep -nE "error:|fatal error|BUILD FAILED|BUILD SUCCEEDED" build.log | head -30 || true

      - name: Locate app
        if: always()
        run: |
          find . -name "3105.app" -maxdepth 6 2>/dev/null
          ls -la dd/Build/Products/Release-iphoneos/3105.app 2>/dev/null | head

      - name: Package ipa
        if: always()
        run: |
          APP=$(find . -name "3105.app" -maxdepth 6 | head -1)
          if [ -n "$APP" ] && [ -f "$APP/3105" ]; then
            echo "APP found: $APP"
            rm -rf Payload && mkdir Payload
            cp -R "$APP" Payload/
            zip -qry 3105-unsigned.ipa Payload
            brew install ldid >/dev/null 2>&1 || true
            if command -v ldid >/dev/null 2>&1; then
              ldid -S 3105-unsigned.ipa && cp 3105-unsigned.ipa 3105-ldid.ipa
            fi
            ls -la *.ipa
          else
            echo "App binary missing, skip ipa"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            *.ipa
            build.log
            dd/Build/Products/Release-iphoneos/3105.app/**
          if-no-files-found: warn
